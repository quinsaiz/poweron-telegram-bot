[project]
name = "poweron-telegram-bot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiogram==3.34.0",
    "aiosqlite==0.22.1",
    "alembic==1.20.1",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C90",
    "SIM",
    "TCH",
    "ASYNC",
    "UP",
]
ignore = [
    "E501",
]
unfixable = [
    "F401",
]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
pythonpath = ["."]
