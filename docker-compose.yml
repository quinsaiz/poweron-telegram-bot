services:
  bot:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:9999:9999"
    env_file:
      - .env
    environment:
      TZ: Europe/Kyiv
      PORT: "9999"
    volumes:
      - ./data:/app/data
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
